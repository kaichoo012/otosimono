
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>落し物の詳細 | 学内落し物システム</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <a class="brand" href="index.html">学内落し物システム</a>
  <nav>
    <a class="active" href="index.html">落し物一覧</a>
    <a href="report.html">＋ 報告する</a>
  </nav>
</header>

<main class="container detail-container">

  <a class="back-link" href="index.html">
    ← 落し物一覧に戻る
  </a>

  <div class="detail-title">
    <h1 id="detailName">青い水筒</h1>
    <span class="status">保管中</span>
  </div>

  <section class="detail-card">

    <!-- 写真表示部分 -->
    <div class="gallery">

      <div class="photo-slider">

        <button
          type="button"
          id="prevPhoto"
          class="photo-arrow"
          aria-label="前の写真">
          ◀
        </button>

        <div class="main-photo" id="mainPhoto">
          写真 1
        </div>

        <button
          type="button"
          id="nextPhoto"
          class="photo-arrow"
          aria-label="次の写真">
          ▶
        </button>

      </div>

      <p class="photo-note" id="photoCount">
        1 / 3
      </p>

    </div>

    <!-- 落し物情報 -->
    <div class="detail-info">

      <dl>

        <div>
          <dt>分類</dt>
          <dd id="detailCategory">日用品</dd>
        </div>

        <div>
          <dt>場所</dt>
          <dd id="detailLocation">70号館</dd>
        </div>

        <div>
          <dt>発見日</dt>
          <dd id="detailDate">2026/10/18</dd>
        </div>

        <div>
          <dt>特徴</dt>
          <dd id="detailFeature">
            青色、約500ml。無地の水筒です。
          </dd>
        </div>

        <div>
          <dt>保管先</dt>
          <dd>学生課</dd>
        </div>

      </dl>

      <div class="contact-box">
        <strong>受け取りについて</strong>
        <p>
          心当たりのある方は、学生課窓口でご確認ください。
        </p>
      </div>

      <a
        class="btn-primary full"
        href="mailto:student-support@example.ac.jp?subject=落し物についての問い合わせ">
        この落し物について問い合わせる
      </a>

    </div>

  </section>
</main>

<footer>
  学内落し物システム
</footer>

<script src="script.js"></script>

</body>
</html>
